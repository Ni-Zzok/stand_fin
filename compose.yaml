services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_lab
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - booking_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking_lab
      WORKER_DELAY_MS: "0"
      SECONDARY_DELAY_MS: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  booking_data:
